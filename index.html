<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מדעי המחשב בספיר</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one sticky header with four views; the degree map is the hub, details open in a side panel. */
:root {
  --bg: #f4f6f9; --panel: #ffffff; --ink: #17212e; --muted: #5a6677; --line: #d9dfe7;
  --accent: #1d4f7a; --accent-soft: #e2ecf6; --warn: #b4461b; --warn-soft: #fbe9df; --ok: #2c7a4b;
  --c-math: #3d6fb6; --c-theory: #6a4fb0; --c-sys: #2f8a8a; --c-prog: #c27a1f; --c-data: #7d8a2c;
  --c-ai: #c0396b; --c-se: #8a4a2a; --c-eth: #4d7d3a; --c-proj: #5a6677; --c-el: #8792a2;
  --g1: #2f6fb0; --g2: #c46a1b; --g3: #2f8a5b; --g4: #8a4fb0; --g5: #b03f6f; --g6: #5b6b2f;
  --f-display: "Frank Ruhl Libre", "David", Georgia, serif;
  --f-body: "Assistant", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111821; --panel: #18222e; --ink: #e6ebf1; --muted: #9aa7b8; --line: #2c3949;
  --accent: #7fb1e0; --accent-soft: #1d3247; --warn: #f0905f; --warn-soft: #3a2419; --ok: #6cc394;
  --c-math: #7ea6e3; --c-theory: #a891e6; --c-sys: #63c1c1; --c-prog: #e8a95a; --c-data: #b7c35c;
  --c-ai: #ee7aa3; --c-se: #d08a66; --c-eth: #8fc47a; --c-proj: #9aa7b8; --c-el: #8d99aa; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111821; --panel: #18222e; --ink: #e6ebf1; --muted: #9aa7b8; --line: #2c3949;
  --accent: #7fb1e0; --accent-soft: #1d3247; --warn: #f0905f; --warn-soft: #3a2419; --ok: #6cc394;
  --c-math: #7ea6e3; --c-theory: #a891e6; --c-sys: #63c1c1; --c-prog: #e8a95a; --c-data: #b7c35c;
  --c-ai: #ee7aa3; --c-se: #d08a66; --c-eth: #8fc47a; --c-proj: #9aa7b8; --c-el: #8d99aa; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; direction: rtl;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0 }
h1 { font-size: 1.55rem } h2 { font-size: 1.6rem; margin-bottom: .4rem } h3 { font-size: 1.15rem }
.wrap { max-width: 1240px; margin: 0 auto }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 12px 0; margin-bottom: 20px }
.toprow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; justify-content: space-between }
.sub { color: var(--muted); font-size: .9rem }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px }
nav.tabs a { padding: 8px 14px; border-radius: 8px 8px 0 0; color: var(--muted); text-decoration: none; font-weight: 600; white-space: nowrap; border: 1px solid transparent; border-bottom: 0 }
nav.tabs a[aria-current="page"] { background: var(--panel); color: var(--ink); border-color: var(--line) }
nav.tabs a.hiddenTab { display: none } nav.tabs a.hiddenTab.shown { display: inline-block; color: var(--accent) }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
section.view { display: grid; gap: 18px }
.lead { max-width: 70ch; color: var(--ink); font-size: 1.05rem; margin: 0 }
.muted { color: var(--muted) } .small { font-size: .85rem }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel) }
.trackNote { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; max-width: 90ch }
.map { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px }
@media (max-width: 1050px) { .map { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
@media (max-width: 640px) { .map { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 420px) { .map { grid-template-columns: minmax(0, 1fr) } }
.sem { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.semhead { display: flex; justify-content: space-between; align-items: baseline; gap: 6px }
.semhead b { font-family: var(--f-display); font-size: 1.02rem } .semhead span { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums }
.tile { all: unset; cursor: pointer; display: block; border-radius: 8px; padding: 6px 8px; background: color-mix(in srgb, var(--cc) 12%, var(--panel)); border-inline-start: 4px solid var(--cc); font-size: .88rem; line-height: 1.3 }
.tile:hover { background: color-mix(in srgb, var(--cc) 22%, var(--panel)) }
.tile:focus-visible { outline: 2px solid var(--accent) }
.tile .nz { color: var(--muted); font-size: .76rem; font-variant-numeric: tabular-nums }
.tile .tag { display: inline-block; font-size: .7rem; padding: 0 6px; border-radius: 999px; margin-inline-start: 4px; background: var(--bg); color: var(--muted) }
.tile .tag.w { background: var(--warn-soft); color: var(--warn) } .tile .tag.n { background: var(--accent-soft); color: var(--accent) }
.tile.slot { background: transparent; border: 1.5px dashed var(--c-el); border-inline-start-width: 1.5px; color: var(--muted) }
.tile.clash { box-shadow: inset 0 0 0 2px var(--warn) }
.tile.cut { opacity: .5; text-decoration: line-through }
.emptyTrack { font-size: .8rem; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 6px 8px }
.weekBtn { margin-top: auto; font: inherit; font-size: .8rem; border: 1px solid var(--line); background: transparent; color: var(--accent); border-radius: 8px; padding: 4px 8px; cursor: pointer }
.tl { display: grid; grid-template-columns: 78px repeat(13, 1fr); gap: 3px; margin-top: 10px; font-size: .78rem }
.tlwk { text-align: center; color: var(--muted, #667); font-variant-numeric: tabular-nums }
.tllab { color: var(--muted, #667); align-self: center; font-size: .72rem }
.tlgrp { grid-column: 1 / -1; font-weight: 600; margin-top: 6px }
.tlbar { background: color-mix(in srgb, var(--cc) 22%, transparent); border-inline-start: 4px solid var(--cc); border-radius: 4px; padding: 3px 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; position: relative }
.tlbar .hk { float: left; font-size: .68rem; opacity: .8 }
.tag.blk { background: color-mix(in srgb, var(--c-ai) 18%, transparent) }
.blknote { font-size: .75rem; color: var(--muted, #667); margin: -2px 0 6px }
table.cmp td:first-child { font-weight: 600; white-space: nowrap }
.stcard h4.step { display: flex; align-items: center; gap: 8px; margin: 18px 0 6px; font-size: 1rem }
.stcard h4.step span { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent, #4a7bd0); color: #fff; font-size: .8rem }
.stcard .chg li { margin: 3px 0 }
.stsel .seg button { font-size: 1rem; padding: 8px 18px }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--cc); display: inline-block }
.legend .zero { color: var(--warn); font-weight: 700 }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0 }
.card .num { font-family: var(--f-display); font-size: 2rem; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums }
.card .num.w { color: var(--warn) }
.card h3 { margin: 4px 0 6px }
.card p { margin: 0; color: var(--muted) }
.card p.fix { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--ink); font-size: .88rem } .card p.fix a { color: var(--accent); font-weight: 700; text-decoration: none }
.card p.src, p.src { margin-top: 8px; font-size: .8rem } .src a, table.t a { color: var(--accent) }
.group h3 { margin-bottom: 8px }
.ellist { list-style: none; padding: 0; margin: 6px 0 12px } .ellist li { margin: 6px 0; list-style: none } .elrow .tag { display: inline-block; margin-inline-start: 6px; margin-block: 2px } .elrow { width: 100%; text-align: start; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: inherit; font: inherit; cursor: pointer; line-height: 1.6 } .elrow:hover { border-color: var(--accent) }
button.tile.slot { cursor: pointer; color: var(--accent) }
a.full { color: var(--accent); font-weight: 700 }
.theme { margin-top: 8px } .chain { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.5fr); gap: 16px; margin-top: 10px; align-items: start }
.chain h4 { margin: 0 0 8px; font-size: .85rem; color: var(--muted, #8a94a6); letter-spacing: .02em } .chain .cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)) }
.wi { padding: 8px 10px; margin-bottom: 8px; border-inline-start: 3px solid var(--accent); font-size: .92rem; line-height: 1.5 } .wi .src { display: block; margin-top: 3px; font-size: .8rem }
.qbox { margin-top: 12px; padding: 12px 16px; border: 1px solid var(--accent); border-radius: 12px } .qbox > span { font-size: .8rem; font-weight: 700; color: var(--accent) } .qbox h3 { margin: 2px 0 4px } .qbox p { margin: 0; font-size: .92rem }
@media (max-width: 760px) { .chain { grid-template-columns: minmax(0,1fr) } }
h2.part { margin-top: 28px; padding-top: 14px; border-top: 2px solid var(--line); scroll-margin-top: 70px } h2.part:first-of-type { border-top: 0; margin-top: 4px }
nav.jump { display: flex; flex-wrap: wrap; gap: 8px } nav.jump a { cursor: pointer; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; color: var(--accent); font-weight: 700; font-size: .9rem }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 6px }
.q h3 { font-size: 1.25rem } .q p { margin: 0; max-width: 75ch }
.q .why { color: var(--muted) }
.say { border-inline-start: 3px solid var(--accent); padding-inline-start: 12px; max-width: 80ch }
.say b { display: block }
table.t { border-collapse: collapse; width: 100%; font-size: .9rem }
.tw { overflow-x: auto }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: right; vertical-align: top }
table.t th { color: var(--muted); font-weight: 600 }
table.t td.n { font-variant-numeric: tabular-nums; text-align: center }
.up { color: var(--ok); font-weight: 700 } .dn { color: var(--warn); font-weight: 700 }
.reveal { justify-self: start; font: inherit; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 10px; padding: 8px 14px; cursor: pointer }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.seg button { font: inherit; font-weight: 600; border: 0; background: var(--panel); color: var(--muted); padding: 7px 14px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel) }
/* side panel */
.scrim { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); z-index: 20 }
aside.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(560px, 100%); background: var(--panel); z-index: 21; overflow-y: auto; border-inline-end: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px) max(20px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; align-content: start }
aside.drawer.wide { width: min(1180px, 100%) }
.close { justify-self: end; font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 4px 12px; cursor: pointer }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px 12px; font-size: .92rem }
.kv dt { color: var(--muted) } .kv dd { margin: 0 }
.comp { display: flex; height: 40px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--panel) }
.comp .seg { min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--sc); color: #fff; padding: 0 3px; line-height: 1.15; overflow: hidden }
.comp .seg .sn { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .7rem }
.comp .seg .sp { font-size: .78rem; white-space: nowrap; max-width: 100%; overflow: hidden }
.kv dd { min-width: 0 }
.comps { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 3px; font-size: .88rem }
.comps li { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap }
.comps i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none }
.m-supervised { background: var(--accent) } .m-oral { background: var(--ok) } .m-unsupervised { background: var(--warn) } .m-unclear, .m-attendance, .m-inclass { background: var(--muted) }
ul.clean { margin: 0; padding-inline-start: 18px } ul.clean li { margin: 2px 0 }
/* week grid */
.weeks { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px }
.wk h4 { margin: 0 0 6px; font-size: .95rem }
.wkg { display: grid; gap: 3px }
.dh { text-align: center; font-size: .78rem; font-weight: 700; background: var(--bg); border-radius: 4px }
.dc { position: relative; border: 1px solid var(--line); border-radius: 4px; background: var(--bg) }
.hl { position: absolute; left: 0; right: 0; border-top: 1px dotted var(--line); font-size: .62rem; color: var(--muted) }
.hl span { position: absolute; left: 2px; top: -1px }
.ss { position: absolute; border-radius: 4px; padding: 1px 3px; font-size: .68rem; line-height: 1.15; overflow: hidden; background: color-mix(in srgb, var(--cc) 18%, var(--panel)); border-inline-start: 3px solid var(--cc) }
.ss.tir { background: color-mix(in srgb, var(--cc) 7%, var(--panel)); border: 1px dashed var(--cc); border-inline-start: 3px solid var(--cc) }
.ss.el { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--cc) 14%, var(--panel)) 0 4px, var(--panel) 4px 8px) }
.ss.blk { --cc: var(--ok) }
.ss b { display: block; font-weight: 700 } .ss .tm { direction: ltr; unicode-bidi: isolate }
.wm { font-size: .8rem; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums } .wm b { color: var(--ink) }
.wn { font-size: .78rem; color: var(--muted); margin: 4px 0 0; padding-inline-start: 16px }
@media (prefers-reduced-motion: no-preference) { .tile, .chip { transition: background .15s } }
</style>
</head>
<body>


<div class="wrap">
<header class="top">
  <div class="toprow">
    <h1>מדעי המחשב בספיר · תשפ"ז</h1>
    <span class="sub">ועדת ההוראה, 25.11.2026 · מצב קיים, לפי הסילבוסים ומערכת השעות</span>
  </div>
  <nav class="tabs" aria-label="חלקי העמוד">
    <a href="#path">המסלול</a>
    <a href="#gaps">מה השתנה ב-2026 – פערים</a>
    <a href="#directions" id="dirTab">כיוונים לדיון</a>
  </nav>
</header>

<main id="app"><p class="muted">טוען נתונים…</p></main>
</div>
<div id="overlay"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const SEMN = { y1a: 'שנה א · סמסטר א', y1b: 'שנה א · סמסטר ב', y2a: 'שנה ב · סמסטר א', y2b: 'שנה ב · סמסטר ב', y3a: 'שנה ג · סמסטר א', y3b: 'שנה ג · סמסטר ב' };
const SEML = { y1a: 'א', y1b: 'ב', y2a: 'א', y2b: 'ב', y3a: 'א', y3b: 'ב' };
const cc = cat => `var(--c-${cat || 'el'})`;
let D = null, track = 'general', dirState = 'today';
try { track = localStorage.getItem('track') || 'general' } catch (e) {}

fetch('data.json').then(r => r.json()).then(d => { D = d; route(); }).catch(() => { $('#app').innerHTML = '<p>לא ניתן לטעון את הנתונים.</p>'; });
window.addEventListener('hashchange', route);

function route() {
  if (!D) return;
  let v = (location.hash || '#path').slice(1);
  if (v === 'ai' || v === 'questions') v = 'gaps';
  if (!['path', 'gaps', 'directions'].includes(v)) v = 'path';
  
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.getAttribute('href') === '#' + v ? 'page' : 'false'));
  $('#app').innerHTML = { path: viewPath, gaps: viewStatus, directions: viewDirections }[v]();
  bind();
  window.scrollTo(0, 0);
}

/* ---------- the degree map ---------- */
function electivesFor(sem, n) {
  const semL = SEML[sem], T = D.tracks[track];
  const offered = D.electives.filter(e => e.sems.includes(semL));
  if (track === 'general') return { tiles: Array.from({ length: n }, () => `<button class="tile slot" data-elslot="${sem}" data-n="${n}">קורס בחירה ›</button>`).join(''), note: '' };
  const mine = offered.filter(e => T.list.includes(e.id));
  let html = mine.map(e => { const cl = []; return `<button class="tile${cl.length ? ' clash' : ''}" data-course="${e.id}" style="--cc:${cc(e.dom)}">${esc(e.name)} <span class="tag">מסלול</span>${cl.length ? `<span class="tag w">מתנגש עם ${esc(cl[0].with)}</span>` : ''}</button>`; }).join('');
  if (!mine.length) html = `<div class="emptyTrack">אין בסמסטר הזה אף קורס של מסלול ${esc(T.name)}. הסטודנט בוחר ${n} מקורסים אחרים.</div>`;
  html += `<button class="tile slot" data-elslot="${sem}" data-n="${n}">כל קורסי הבחירה בסמסטר ›</button>`;
  return { tiles: html, note: '' };
}
function trackNote() {
  if (track === 'general') return 'הליבה זהה לכל הסטודנטים. בחרו מסלול כדי לראות אילו קורסים שלו נפתחים בפועל בכל סמסטר שבו התכנית מציבה בחירה. ' + esc(D.tracks.general.req || '');
  if (track === 'pm') return 'במסלול ניהול מוצר שמונה קורסי התמחות (18 נ"ז) באים במקום ששת קורסי הבחירה. לפי ראש המחלקה, חמישה מהם עדיין לא פותחו.';
  const T = D.tracks[track]; const n = { y2b: 2, y3a: 1, y3b: 3 };
  const got = Object.entries(n).map(([s]) => D.electives.filter(e => e.sems.includes(SEML[s]) && T.list.includes(e.id)).length);
  const clash = D.electives.filter(e => T.list.includes(e.id) && e.clashes.length);
  return `מסלול ${esc(T.name)}: קורסי המסלול שנפתחים בתשפ"ז – ${got[0]} בשנה ב סמסטר ב, ${got[1]} בשנה ג סמסטר א, ${got[2]} בשנה ג סמסטר ב. דרישות המסלול, לפי המחלקה: ${esc(T.req || '')}`;
}
/* blocks in proposal B: course id -> weeks, per semester */
function blockMap() {
  const m = {};
  for (const w of D.weeks || []) { if (!w.B) continue; const y = w.title.startsWith('שנה א') ? 1 : w.title.startsWith('שנה ב') ? 2 : w.title.startsWith('שנה ג') ? 3 : 0; if (!y) continue;
    const key = 'y' + y + (w.sem === 'א' ? 'a' : 'b'); if (m[key]) continue;
    const b = w.B.ses.find(s => s.kind === 'blk'); if (b) { m[key] = {}; for (const x of b.blocks) m[key][x.id] = x; } }
  return m;
}
function semTimeline(st) {
  const w = (D.weeks || []).find(x => x.title.startsWith('שנה ב') && x.sem === 'ב' && x.B); if (!w) return '';
  const all = [...D.B.flatMap(s => s.courses), ...D.today.flatMap(s => s.courses)];

  let h = `<button class="close" data-close>סגירה</button><h2>השבוע של הסטודנט · ${esc(w.title)} · סמסטר ${w.sem}</h2>`;
  if (w.note) h += `<p class="small muted">${esc(w.note)}</p>`;
  if (sem.startsWith('y1')) h += `<p class="small muted">מחזור אוקטובר (מתחילים בסמסטר א). מחזור האביב מופיע למטה.</p>`;
  h += `<p class="small muted">קבוצת ההרצאה והתרגול הראשונות שאינן מתנגשות, לפי מערכת השעות מ-19.11.2026. ימים ד–ה פנויים לסטודנטים שעובדים.</p>`;
  if (!withProposals) h += `<div class="wk">${gridHTML(w.cur)}${mline(w.m.cur)}</div>`;
  else h += `<div class="weeks"><div class="wk"><h4>היום</h4>${gridHTML(w.cur)}${mline(w.m.cur)}</div><div class="wk"><h4>הצעה א · כללי שיבוץ</h4>${gridHTML(w.A.ses)}${mline(w.m.A)}${w.A.notes.length ? `<ul class="wn">${w.A.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div>${w.B ? `<div class="wk"><h4>הצעה ב · יסודות בריווח, נושאים בבלוקים</h4>${gridHTML(w.B.ses)}${mline(w.m.B)}${w.B.notes.length ? `<ul class="wn">${w.B.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}</div>` : ''}</div><p class="small muted">* שעות משוערות. הדמיה להמחשה: חדרים וזמינות מרצים בהצעה ב לא נבדקו.</p>`;
  if (sem.startsWith('y1') && D.spring) h += `<h3>מחזור אביב (מתחילים בסמסטר ב)</h3><div class="weeks"><div class="wk"><h4>סמסטר ב – הסמסטר הראשון שלהם</h4>${gridHTML(D.spring.B)}</div><div class="wk"><h4>קיץ – הסמסטר השני שלהם</h4>${gridHTML(D.spring.K)}</div></div><p class="small muted">מערכות ספרתיות ומבוא למתמטיקה אינם נפתחים בסמסטר ב במסלול הרגיל; חדו"א 1 אינו נפתח בקיץ. ההנחה: מי שמתחיל באביב עומד בדרישת המתמטיקה, ומי שמתקבל על תנאי עומד בתנאי בחדו"א 1.</p>`;

  <div class="card"><h3>על מה הכיוונים נשענים: מחקר</h3><p>כל אחד מהרכיבים בכיוונים האלה נבדק במחקר, והתוצאות ברורות:</p><ul class="clean small" style="margin-top:6px"><li><b>למידה פעילה במקום הרצאה:</b> מטא-אנליזה של 225 מחקרים בקורסי מדעים, הנדסה ומתמטיקה – שיעור הכישלון ירד מ-34% ל-22%, והציונים עלו בכחצי סטיית תקן. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4060654/" target="_blank" rel="noopener">Freeman ועמיתיו, PNAS 2014</a></li><li><b>למידה מבוססת פרויקטים ובעיות:</b> זכירה טובה יותר לטווח ארוך ופיתוח מיומנויות, על פני שמונה מטא-אנליזות (רובן ברפואה). <a href="https://docs.lib.purdue.edu/ijpbl/vol3/iss1/4/" target="_blank" rel="noopener">Strobel ו-van Barneveld 2009</a></li><li><b>ריווח ושזירה:</b> חומר שחוזרים אליו במרווחים ובתרגול מעורב נזכר הרבה יותר זמן. <a href="https://doi.org/10.1037/0033-2909.132.3.354" target="_blank" rel="noopener">Cepeda ועמיתיו 2006</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/31556629/" target="_blank" rel="noopener">Brunmair ו-Richter 2019</a></li><li><b>בלוקים:</b> אחרי המעבר לבלוקים עלה שיעור המעבר בשנה א מ-74% ל-87% תוך שנתיים, בעיקר אצל סטודנטים מרקע חלש. <a href="https://www.vu.edu.au/mitchell-institute/tertiary-education/inside-the-black-box-of-the-vu-block-model" target="_blank" rel="noopener">Victoria University</a></li></ul><p style="margin-top:8px">מה שעוד לא נבדק הוא השילוב של כל הרכיבים בתכנית אחת. לכן מוצע פיילוט בשנתון אחד, שימדוד את זה אצלנו.</p></div>

function bind() {

  document.querySelectorAll('#app [data-pmslot]').forEach(b => b.addEventListener('click', openPM));
  document.querySelectorAll('[data-state]').forEach(b => b.addEventListener('click', () => { dirState = b.dataset.state; route(); }));
  document.querySelectorAll('#app [data-course]').forEach(b => b.addEventListener('click', () => openCourse(b.dataset.course)));
  document.querySelectorAll('[data-week]').forEach(b => b.addEventListener('click', () => openWeek(b.dataset.week, (location.hash || '') === '#directions')));
  document.querySelectorAll('[data-weekp]').forEach(b => b.addEventListener('click', () => openWeek(b.dataset.weekp, true)));
  const r = $('[data-reveal]'); if (r) r.addEventListener('click', () => { location.hash = 'directions'; });
}
